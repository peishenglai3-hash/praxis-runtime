name: Praxis Provider Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile
      # This step was named "Run provider-independent adapter smoke" while the
      # test it ran asserted `expect(true).toBe(true)` — a guarantee the step
      # did not test. The name now says what the test actually does. The
      # adapter half of that guarantee belongs to EPIC-010 and is not claimed
      # until that epic exists. See BP-050.
      - name: Run the repository smoke path
        run: pnpm exec vitest run tests/smoke.test.ts
