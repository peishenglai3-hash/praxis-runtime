name: Praxis Provider Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Run provider-independent adapter smoke
        run: pnpm exec vitest run tests/smoke.test.ts
